name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Ruff lint
        run: uv run --only-dev ruff check .
      - name: Ruff format
        run: uv run --only-dev ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      # Every test must run in CI: skipping for a missing tool fails the build.
      PAPERREADY_REQUIRE_ALL_TESTS: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Install TeX Live, BibTeX and Ghostscript
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-binaries texlive-base texlive-latex-base \
            texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended ghostscript

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Install Chromium for the browser tests
        run: uv run playwright install --with-deps chromium

      - name: Run the tests with coverage
        run: uv run pytest -ra --cov --cov-report=term-missing

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the image
        run: docker build -t paperready .

      - name: Start it and wait until it is healthy
        run: |
          docker run -d --name paperready -p 8501:8501 paperready
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8501/_stcore/health; then exit 0; fi
            sleep 2
          done
          docker logs paperready
          exit 1

      - name: Check the tools the app needs
        run: |
          docker exec paperready sh -c 'command -v bibtex && command -v gs'
          docker exec paperready python -c "import aclpubcheck, arxiv_latex_cleaner, streamlit"
